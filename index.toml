# Crab Market index
#
# The registry `opencrabs crab search` reads. One dir per crab under
# crabs/<name>/ (crab.toml + skills/).

[[crabs]]
name = "competitor-watch"
version = "0.1.0"
description = "Daily page-diff over watched URLs; reports only what changed"
category = "monitor"
repo = "https://github.com/moneyacademyKE/crab-market"
path = "crabs/competitor-watch"

[[crabs]]
name = "morning-newspaper"
version = "0.1.0"
description = "Daily morning digest: pulls RSS/YouTube feeds, reports only what's new since the last edition"
category = "digest"
repo = "https://github.com/moneyacademyKE/crab-market"
path = "crabs/morning-newspaper"

[[crabs]]
name = "last30days"
version = "0.1.0"
description = "On-demand opinion research with a hard 30-day recency window: dated events, attributed takes, sourced brief"
category = "research"
repo = "https://github.com/moneyacademyKE/crab-market"
path = "crabs/last30days"

[[crabs]]
name = "haggle-bot"
version = "0.1.0"
description = "SaaS spend audit over billing statements you provide: duplicates, hikes, seat creep, draft cancellation scripts (draft-only)"
category = "finance"
repo = "https://github.com/moneyacademyKE/crab-market"
path = "crabs/haggle-bot"

[[crabs]]
name = "nightly-audit"
version = "0.1.0"
description = "Nightly git-hygiene audit over active repos: dirty trees, unpushed commits, behind-remote drift. Reports failures only — silence means all clear"
category = "monitor"
repo = "https://github.com/moneyacademyKE/crab-market"
path = "crabs/nightly-audit"
[[crabs]]
name = "site-canary"
version = "0.1.0"
description = "Daily uptime canary over a URL watchlist; tattles only on failures - silence means all green"
category = "monitor"
repo = "https://github.com/moneyacademyKE/crab-market"
path = "crabs/site-canary"

[[crabs]]
name = "repo-pulse"
version = "0.1.0"
description = "Daily GitHub pulse over watched repos: new issues, PRs, releases and failed CI since last run, via gh. Speaks only when action is needed"
category = "monitor"
repo = "https://github.com/moneyacademyKE/crab-market"
path = "crabs/repo-pulse"

[[crabs]]
name = "standup-crab"
version = "0.1.0"
description = "Daily internal standup draft: last-24h commits across active repos plus the in-flight ledger, distilled to Shipped / In flight / Blockers"
category = "digest"
repo = "https://github.com/moneyacademyKE/crab-market"
path = "crabs/standup-crab"

[[crabs]]
name = "changelog-scribe"
version = "0.1.0"
description = "Weekly release-notes drafts from commits since the last tag per repo, written as draft files - never published without owner approval"
category = "document"
repo = "https://github.com/moneyacademyKE/crab-market"
path = "crabs/changelog-scribe"

[[crabs]]
name = "critiquito"
version = "0.1.0"
description = "On-demand design critique: hierarchy, contrast, type and motion verdicts on a screenshot, URL or described UI, with concrete ranked fixes. Invoke as /critiquito <target>"
category = "design"
repo = "https://github.com/moneyacademyKE/crab-market"
path = "crabs/critiquito"

[[crabs]]
name = "security-audit"
version = "0.1.0"
description = "Scored 0-100 security and CVE audit of a repo: dependency CVEs, secrets, auth surfaces, input handling, config. Findings ranked with file receipts. Report-only. Invoke as /security-audit <repo-path>"
category = "security"
repo = "https://github.com/moneyacademyKE/crab-market"
path = "crabs/security-audit"

[[crabs]]
name = "read-book"
version = "0.1.0"
description = "Structured notes from books and long PDFs: chapter TL;DRs, key concepts, quotes with locators, action items. Modes: notes, summary, quotes, study. Invoke as /read-book <file|url> [mode]"
category = "document"
repo = "https://github.com/moneyacademyKE/crab-market"
path = "crabs/read-book"

[[crabs]]
name = "watch-video"
version = "0.1.0"
description = "Transcribe and analyze video at chosen depth: transcript, visual (frames + vision), multimodal. YouTube, Loom, Vimeo, local files, anything yt-dlp supports. Invoke as /watch-video <url|path> [depth]"
category = "media"
repo = "https://github.com/moneyacademyKE/crab-market"
path = "crabs/watch-video"

[[crabs]]
name = "unstuck"
version = "0.1.0"
description = "The roadblock antidote: classifies what kind of impossible you hit, runs lateral-thinking techniques, returns viable angles with next actions - or an honest wall-is-load-bearing verdict. Invoke as /unstuck <blocker>"
category = "productivity"
repo = "https://github.com/moneyacademyKE/crab-market"
path = "crabs/unstuck"

[[crabs]]
name = "maker-council"
version = "0.1.0"
description = "A simulated board of advisors staffed by operator personas whose lenses collide: seats 3-5 for a real decision, surfaces the disagreement, synthesizes what changed. Invoke as /maker-council <question>"
category = "advisory"
repo = "https://github.com/moneyacademyKE/crab-market"
path = "crabs/maker-council"

[[crabs]]
name = "pstack"
version = "0.15.15"
description = "Cursor's pstack ported to crabs: 50 rigorous workflow + principle skills by Lauren Tan (MIT). architect, swarm, tdd, reflect, unslop, poteto-mode playbooks, 20 principle-* skills"
category = "developer-tools"
repo = "https://github.com/moneyacademyKE/crab-market"
path = "crabs/pstack"
